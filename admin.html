<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة إيموشا خدمتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        .card { background: #f8fafc; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .btn-approve { background: #16a34a; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn-delete { background: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; margin-right: 8px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pending { background: #fef08a; color: #854d0e; }
        .approved { background: #bbf7d0; color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة إدارة الطلبات - إيموشا خدمتي</h1>
    <p>مرحباً بك، يمكنك قبول الطلبات لتظهر في الموقع فوراً أو حذف أي طلب غير مرغوب فيه.</p>
    <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">
    <div id="adminList">جاري تحميل الطلبات...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlWM7-RXhnz1Wjs5riDkwNesut_dPfBTc",
  authDomain: "emosha-kings.firebaseapp.com",
  projectId: "emosha-kings",
  storageBucket: "emosha-kings.firebasestorage.app",
  messagingSenderId: "895634926894",
  appId: "1:895634926894:web:f62217521ff33a876fdebf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const adminList = document.getElementById('adminList');

// كلمة السر للدخول للوحة الإدارة
const SECRET_PASS = "123010111  55Ee"; 

const pass = prompt("أدخل كلمة سر الإدارة للوصول:");
if (pass !== SECRET_PASS) {
    alert("كلمة السر خاطئة!");
    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>غير مسموح بالدخول</h2>";
} else {
    loadAllRequests();
}

async function loadAllRequests() {
    try {
        const querySnapshot = await getDocs(collection(db, "services"));
        adminList.innerHTML = '';

        if(querySnapshot.empty) {
            adminList.innerHTML = "<p>لا توجد طلبات مسجلة حتى الآن.</p>";
            return;
        }

        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3 style="margin-top:0;">${data.name} <span class="badge ${data.status}">${data.status === 'approved' ? 'مقبول ومفعل' : 'قيد المراجعة'}</span></h3>
                <p><strong>التصنيف:</strong> ${data.category} | <strong>المنطقة:</strong> ${data.region}</p>
                <p><strong>الهاتف:</strong> ${data.phone} | <strong>واتساب:</strong> ${data.whatsapp}</p>
                <p><strong>الوصف:</strong> ${data.description || 'بدون وصف'}</p>
                <div style="margin-top:10px;">
                    ${data.status !== 'approved' ? `<button class="btn-approve" onclick="approve('${id}')">موافقة وتفعيل الآن</button>` : ''}
                    <button class="btn-delete" onclick="remove('${id}')">حذف الطلب</button>
                </div>
            `;
            adminList.appendChild(card);
        });
    } catch (err) {
        console.error(err);
        adminList.innerHTML = "حدث خطأ أثناء تحميل البيانات.";
    }
}

window.approve = async (id) => {
    if(confirm("هل تريد تفعيل هذه الخدمة لنشرها في الموقع؟")) {
        await updateDoc(doc(db, "services", id), { status: "approved" });
        alert("تم التفعيل والنشر بنجاح!");
        loadAllRequests();
    }
};

window.remove = async (id) => {
    if(confirm("هل أنت متأكد من حذف هذه الخدمة؟")) {
        await deleteDoc(doc(db, "services", id));
        alert("تم الحذف بنجاح!");
        loadAllRequests();
    }
};
</script>

</body>
</html>
