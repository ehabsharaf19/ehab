<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة إيموشا خدمتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        .section-title { margin-top: 30px; margin-bottom: 15px; color: #1e293b; font-size: 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; }
        .card { background: #f8fafc; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .pending-card { background: #fffbeb; border: 1px solid #fde68a; }
        .btn-approve { background: #16a34a; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn-delete { background: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; margin-right: 8px; }
        .btn-load-more { display: block; width: 100%; padding: 12px; background: #2563eb; color: white; text-align: center; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-family: inherit; }
        .btn-load-more:hover { background: #1d4ed8; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pending { background: #fef08a; color: #854d0e; }
        .approved { background: #bbf7d0; color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة إدارة الطلبات - إيموشا خدمتي</h1>
    <p>تدار الخدمات الأحدث أولاً، الطلبات المعلقة تُعرض بوضوح لإتخاذ الإجراء.</p>
    <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">
    
    <!-- قسم الطلبات قيد المراجعة -->
    <div class="section-title" style="color: #b45309;">
        <span>⏳ الطلبات المعلقة (تنتظر الموافقة)</span>
        <span id="pendingCount" class="badge pending">0</span>
    </div>
    <div id="pendingList">جاري تحميل الطلبات المعلقة...</div>

    <!-- قسم الطلبات المقبولة والتنقل -->
    <div class="section-title" style="color: #15803d;">
        <span>✅ الخدمات المنشورة (المفعلة)</span>
        <span id="approvedCount" class="badge approved">0</span>
    </div>
    <div id="approvedList">جاري تحميل الخدمات المفعلة...</div>
    <button id="loadMoreBtn" class="btn-load-more" style="display: none;" onclick="showMoreApproved()">عرض المزيد من الخدمات المقبولة ➕</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlWM7-RXhnz1Wjs5riDkwNesut_dPfBTc",
  authDomain: "emosha-kings.firebaseapp.com",
  projectId: "emosha-kings",
  storageBucket: "emosha-kings.firebasestorage.app",
  messagingSenderId: "895634926894",
  appId: "1:895634926894:web:f62217521ff33a876fdebf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const pendingList = document.getElementById('pendingList');
const approvedList = document.getElementById('approvedList');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const pendingCount = document.getElementById('pendingCount');
const approvedCount = document.getElementById('approvedCount');

let allApprovedItems = [];
let visibleApprovedLimit = 3; // عدد الخدمات المقبولة المعروضة في البداية

const SECRET_PASS = "123010111  55Ee"; 

const pass = prompt("أدخل كلمة سر الإدارة للوصول:");
if (pass !== SECRET_PASS) {
    alert("كلمة السر خاطئة!");
    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>غير مسموح بالدخول</h2>";
} else {
    loadAllRequests();
}

async function loadAllRequests() {
    try {
        // جلب كافة البيانات مرتبة بالأحدث
        const q = query(collection(db, "services"), orderBy("createdAt", "desc"));
        let querySnapshot;
        
        try {
            querySnapshot = await getDocs(q);
        } catch (e) {
            // في حال عدم وجود حقل createdAt في البيانات القديمة يتم الجلب العادي
            querySnapshot = await getDocs(collection(db, "services"));
        }

        pendingList.innerHTML = '';
        approvedList.innerHTML = '';
        allApprovedItems = [];

        let pendingItems = [];

        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            data.id = docSnap.id;
            if (data.status === 'approved') {
                allApprovedItems.push(data);
            } else {
                pendingItems.push(data);
            }
        });

        // 1. عرض الطلبات المعلقة بالكامل (الأحدث أولاً)
        pendingCount.textContent = pendingItems.length;
        if (pendingItems.length === 0) {
            pendingList.innerHTML = "<p style='color: #64748b;'>لا توجد طلبات معلقة حالياً.</p>";
        } else {
            pendingItems.forEach(data => {
                pendingList.appendChild(createCardHTML(data, true));
            });
        }

        // 2. تجهيز الخدمات المقبولة
        approvedCount.textContent = allApprovedItems.length;
        renderApprovedItems();

    } catch (err) {
        console.error(err);
        pendingList.innerHTML = "حدث خطأ أثناء تحميل البيانات.";
    }
}

function renderApprovedItems() {
    approvedList.innerHTML = '';
    
    if (allApprovedItems.length === 0) {
        approvedList.innerHTML = "<p style='color: #64748b;'>لا توجد خدمات منشورة حتى الآن.</p>";
        loadMoreBtn.style.display = 'none';
        return;
    }

    const itemsToDisplay = allApprovedItems.slice(0, visibleApprovedLimit);
    itemsToDisplay.forEach(data => {
        approvedList.appendChild(createCardHTML(data, false));
    });

    // التحكم في إظهار زر المزيد
    if (allApprovedItems.length > visibleApprovedLimit) {
        loadMoreBtn.style.display = 'block';
    } else {
        loadMoreBtn.style.display = 'none';
    }
}

window.showMoreApproved = () => {
    visibleApprovedLimit += 3; // إظهار 3 خدمات إضافية عند كل ضغطة
    renderApprovedItems();
};

function createCardHTML(data, isPending) {
    const card = document.createElement('div');
    card.className = isPending ? 'card pending-card' : 'card';
    card.innerHTML = `
        <h3 style="margin-top:0;">${data.name} <span class="badge ${data.status}">${data.status === 'approved' ? 'مقبول ومفعل' : 'قيد المراجعة'}</span></h3>
        <p><strong>التصنيف:</strong> ${data.category} | <strong>المنطقة:</strong> ${data.region}</p>
        <p><strong>الهاتف:</strong> ${data.phone} | <strong>واتساب:</strong> ${data.whatsapp || 'غير محدد'}</p>
        <p><strong>الوصف:</strong> ${data.description || 'بدون وصف'}</p>
        <div style="margin-top:10px;">
            ${data.status !== 'approved' ? `<button class="btn-approve" onclick="approve('${data.id}')">موافقة وتفعيل الآن</button>` : ''}
            <button class="btn-delete" onclick="remove('${data.id}')">حذف الطلب</button>
        </div>
    `;
    return card;
}

window.approve = async (id) => {
    if(confirm("هل تريد تفعيل هذه الخدمة لنشرها في الموقع؟")) {
        await updateDoc(doc(db, "services", id), { status: "approved" });
        alert("تم التفعيل والنشر بنجاح!");
        loadAllRequests();
    }
};

window.remove = async (id) => {
    if(confirm("هل أنت متأكد من حذف هذه الخدمة؟")) {
        await deleteDoc(doc(db, "services", id));
        alert("تم الحذف بنجاح!");
        loadAllRequests();
    }
};
</script>

</body>
</html>
